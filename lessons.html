<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ILO</title>
  <link rel="icon" href="assets/logo/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shown only if the page was opened by double-clicking the file. -->
  <div id="file-warning" class="panel error" hidden>
    <h2>ILO necesita un servidor local / ILO needs a local server</h2>
    <p>Abre una terminal en la carpeta de ILO, escribe <code>npm start</code> y luego abre <code>http://localhost:8080</code>.</p>
    <p>Open a terminal in the ILO folder, type <code>npm start</code>, then open <code>http://localhost:8080</code>.</p>
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>

  <header class="top-bar">
    <a class="back" href="index.html" data-i18n="home.backToMap"></a>
    <div class="brand">
      <span class="logo"><img class="logo-mark" src="assets/logo/wordmark.svg" alt="ILO"></span>
      <span class="tagline" data-i18n="app.tagline"></span>
    </div>
    <div id="lang-switch" class="lang-switch"></div>
  </header>

  <main class="home course-page">
    <h1 data-i18n="home.lessons"></h1>
    <div id="save-warning" class="save-warning" role="alert" data-i18n="save.unavailable" hidden></div>
    <div id="error" class="panel error" hidden></div>
    <div class="grade-filter" role="group">
      <span data-i18n="home.filter"></span>
      <div id="grade-buttons" class="grade-buttons"></div>
    </div>
    <p class="muted" data-i18n="home.stateHelp"></p>
    <!-- The course path: one winding line of lessons per grade (Phase 12). -->
    <div id="course" class="course"></div>
    <div class="home-tools">
      <a class="button" href="summary.html" data-i18n="home.summary"></a>
      <button id="save-copy" type="button" class="button" data-i18n="save.export"></button>
      <label class="button"><span data-i18n="save.import"></span><input id="load-copy" type="file" accept=".json,application/json" hidden></label>
      <button id="reset-all" type="button" class="button" data-i18n="home.resetAll"></button>
    </div>
  </main>

  <script type="module" src="js/home.js"></script>
  <script type="module" src="js/register-offline.js"></script>
</body>
</html>
